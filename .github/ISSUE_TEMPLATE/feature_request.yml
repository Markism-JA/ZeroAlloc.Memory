name: Feature or Design Proposal
description: Propose a new primitive, API improvement, or benchmark/test addition
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What workload or bottleneck are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Design / API
      description: Sketch the proposed type/method signatures, ownership rules, and thread-safety model.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered existing primitives in ZeroAlloc.Memory or standard .NET APIs?
